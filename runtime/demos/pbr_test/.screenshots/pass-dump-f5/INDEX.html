<!DOCTYPE html>
<html>
<head>
<title>Pass Dump — Frame 5</title>
<style>
body { background: #1a1a1a; color: #e0e0e0; font-family: monospace; margin: 20px; }
h1 { color: #80ff80; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.cell { background: #2a2a2a; padding: 10px; border-radius: 6px; }
.cell img { width: 100%; cursor: pointer; }
.cell .label { font-size: 13px; margin-bottom: 5px; color: #80ff80; }
.fullscreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; cursor: pointer; }
.fullscreen img { max-width: 95%; max-height: 95%; margin: auto; display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<h1>Pass Dump — Frame 5 (0 targets)</h1>
<div class="grid">
</div>
<div class="fullscreen" id="fullview" onclick="this.style.display='none'">
  <img id="fullimg">
</div>
<script>
function showFull(src) {
  document.getElementById('fullimg').src = src;
  document.getElementById('fullview').style.display = 'block';
}
</script>
</body>
</html>
