<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect x="2" y="2" width="20" height="20" rx="3" fill="#2BA5E8" opacity="0.15"/>
  <!-- document body -->
  <rect x="6" y="5" width="9" height="12" rx="1.5" fill="none" stroke="#2BA5E8" stroke-width="1.4"/>
  <!-- folded corner -->
  <polyline points="12,5 15,8" fill="none" stroke="#2BA5E8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="12,5 12,8 15,8" fill="none" stroke="#2BA5E8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- downward arrow shaft -->
  <line x1="17" y1="12" x2="17" y2="18" stroke="#2BA5E8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- arrowhead -->
  <polyline points="14.5,15.5 17,18.5 19.5,15.5" fill="none" stroke="#2BA5E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
