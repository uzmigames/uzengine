name: Validation tools

on:
  push:
    branches: [main]
    paths: ["scripts/tools/**", "scripts/falcor/**", "runtime/tools/uzembed.cpp", ".github/workflows/validation-tools.yml"]
  pull_request:
    branches: [main]
    paths: ["scripts/tools/**", "scripts/falcor/**", "runtime/tools/uzembed.cpp", ".github/workflows/validation-tools.yml"]

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: python -m pip install -r scripts/falcor/requirements-gate.txt
      - run: python -m unittest discover -s scripts/tools -p "test_*.py"
      - run: python -m unittest discover -s scripts/falcor -p test_falcor_reference_gate.py
      - run: python scripts/tools/rulebook_queue.py --check
