name: MCP

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "runtime/engine/**"
      - "runtime/shaders/**"
      - "extension/src/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp/**"
      - "runtime/engine/**"
      - "runtime/shaders/**"
      - "extension/src/**"
      - ".github/workflows/mcp.yml"

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mcp

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      # The integration suite requires a database from current source.
      - run: npm run type-check
      - run: npm run build
      - run: node dist/tools/generate-docs.js
      - run: npm run test:coverage
