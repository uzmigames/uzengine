<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UzEngine Stream Test</title>
  <style>
    body { background: #1e1e1e; color: #ccc; font-family: monospace; margin: 0; }
    #toolbar { padding: 8px 12px; background: #252526; border-bottom: 1px solid #444; display: flex; gap: 16px; align-items: center; }
    #status { font-weight: bold; }
    #status.connected    { color: #4ec9b0; }
    #status.disconnected { color: #f48771; }
    #status.connecting   { color: #dcdcaa; }
    #log { font-size: 11px; color: #888; max-height: 60px; overflow-y: auto; padding: 4px 12px; background: #1a1a1a; border-bottom: 1px solid #333; }
    #stream-container { display: flex; align-items: center; justify-content: center; background: #000; height: calc(100vh - 100px); }
    #stream { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span style="color:#569cd6;font-weight:bold">UzEngine Test</span>
    <span id="status" class="disconnected">Disconnected</span>
    <span id="fps">-- fps</span>
    <span id="bytes" style="color:#888">-- bytes/frame</span>
  </div>
  <div id="log"></div>
  <div id="stream-container">
    <img id="stream" alt="waiting for stream...">
  </div>

  <script>
    var img = document.getElementById('stream');
    var statusEl = document.getElementById('status');
    var fpsEl = document.getElementById('fps');
    var bytesEl = document.getElementById('bytes');
    var logEl = document.getElementById('log');

    var currentUrl = null;
    var frameCount = 0;
    var lastFpsTick = Date.now();
    var SERVER_URL = 'ws://localhost:9002';

    function log(msg) {
      var line = document.createElement('div');
      line.textContent = new Date().toISOString().substr(11,12) + ' ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    var ws = new WebSocket(SERVER_URL);
    ws.binaryType = 'arraybuffer';
    setStatus('Connecting...', 'connecting');
    log('Connecting to ' + SERVER_URL);

    ws.onopen = function() {
      setStatus('Connected', 'connected');
      log('WebSocket open');
    };

    ws.onmessage = function(e) {
      if (!(e.data instanceof ArrayBuffer)) {
        log('WARN: non-binary message: ' + typeof e.data);
        return;
      }

      var bytes = e.data.byteLength;

      // Log first 4 bytes to verify JPEG magic
      if (frameCount === 0) {
        var view = new Uint8Array(e.data, 0, 4);
        log('First frame: ' + bytes + ' bytes, magic: ' +
          Array.from(view).map(b => b.toString(16).padStart(2,'0')).join(' '));
      }

      var prevUrl = currentUrl;
      currentUrl = URL.createObjectURL(new Blob([e.data], { type: 'image/jpeg' }));
      img.src = currentUrl;
      if (prevUrl) URL.revokeObjectURL(prevUrl);

      frameCount++;
      var now = Date.now();
      if (now - lastFpsTick >= 1000) {
        var fps = Math.round(frameCount * 1000 / (now - lastFpsTick));
        fpsEl.textContent = fps + ' fps';
        bytesEl.textContent = bytes + ' bytes/frame';
        frameCount = 0;
        lastFpsTick = now;
      }
    };

    ws.onerror = function(e) {
      log('ERROR: ' + e.type);
      setStatus('Error', 'disconnected');
    };

    ws.onclose = function(e) {
      log('Closed code=' + e.code + ' reason=' + e.reason);
      setStatus('Disconnected', 'disconnected');
    };

    img.onerror = function() {
      log('IMG onerror — decode failed for frame ' + frameCount);
    };
    img.onload = function() {
      if (frameCount === 1) log('First frame rendered: ' + img.naturalWidth + 'x' + img.naturalHeight);
    };
  </script>
</body>
</html>
