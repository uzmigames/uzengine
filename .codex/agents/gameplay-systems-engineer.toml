    ├── navmesh_agent.h/c       ← CNavMeshAgent, path following, RVO2 avoidance
    └── navmesh_query.h/c       ← Pathfinding queries, nearest point, raycast
```

## Key Specs

Always read before implementing:
- `docs/specs/input-system.md` — InputAction, context stacks, rebinding protocol
- `docs/specs/camera-system.md` — SpringArm, camera modes, DoF, `.uzcam` format
- `docs/specs/save-system.md` — msgpack format, slot system, autosave trigger, Lua ctx.saves
- `docs/specs/localization.md` — CSV schema, LocaleManager, ctx.locale:t(key), font fallback
- `docs/specs/navmesh.md` — Recast/Detour, NavMeshAgent, RVO2, 256 agent limit
- `docs/specs/lua-scripting.md` — Lua API patterns (ctx.* namespace)

## Input System

### InputAction pipeline

```
Hardware (keyboard/mouse/gamepad)
    ↓
InputBackend (polls raw state each frame)
    ↓
InputMapping (maps raw keys → named actions with modifiers)
    ↓
InputContext stack (active context consumes events first)
    ↓
Lua callbacks: ctx.input:on_action("jump", function(ev) ... end)
```

### Rebinding

```lua
-- Lua API
ctx.input:rebind("jump", "Space")          -- keyboard
ctx.input:rebind("aim", "RightTrigger")    -- gamepad
ctx.input:save_bindings()                  -- persists to save slot
```

Bindings are saved as part of the player config in save slot 0 (config slot).

## Camera System

### SpringArm

```c
typedef struct CSpringArm {
    float3 socket_offset;       // offset from entity origin
    float3 target_arm_offset;   // end-point offset
    float  target_arm_length;   // desired length
    float  actual_arm_length;   // after collision (sphere cast)
    float  lag_speed;           // position lag (0 = instant)
    float  rotation_lag_speed;  // rotation lag
    bool   do_collision;        // sphere cast against world geometry
    float  probe_size;          // sphere radius for collision
} CSpringArm;
```

Collision uses `physics_query_sphere_cast()` from the physics system.

### Camera Modes

| Mode | Description | Use case |
|------|-------------|----------|
| `CAMERA_FREE` | No constraint, free fly | Editor, debug |
| `CAMERA_FOLLOW` | Follows entity + SpringArm | Third-person |
| `CAMERA_FIRST_PERSON` | Attached to head socket | FPS |
| `CAMERA_CINEMATIC` | Path-based, spline | Cutscenes |

## Behavior Tree

### Node types

```
Composite:
  Sequence   — runs children left→right, stops on first FAILURE
  Selector   — runs children left→right, stops on first SUCCESS
  Parallel   — runs all children, configurable success/failure policy

Decorator:
  Inverter   — flips child result
  Repeater   — runs child N times (or infinite)
  Timeout    — fails child if it takes > N seconds

Leaf:
  Action     — calls Lua function, returns SUCCESS/FAILURE/RUNNING
  Condition  — reads Blackboard key, returns SUCCESS or FAILURE
```

### Blackboard

```lua
-- Lua API
ctx.bt:set("target_entity", enemy_entity)
ctx.bt:set("alert_level", 2)
ctx.bt:get("target_entity")  -- returns entity handle or nil
```

Blackboard is per-agent (each `CBehaviorTree` has its own `BtBlackboard`).

## Save System

### Slot layout

| Slot | Purpose |
|------|---------|
| 0 | Player config (keybindings, settings) |
| 1–9 | Manual save slots |
| 10 | Autosave |

### Save file format (.uzsave — msgpack)

```
header: { version, timestamp, play_time, scene_name }
thumbnail: JPEG bytes (160×90)
scene_state: { node transforms, script state }
lua_state: { ctx.shared values, ctx.saves custom data }
```

### Lua API

```lua
ctx.saves:save(slot, { extra = "data" })   -- saves current scene + Lua state
ctx.saves:load(slot)                        -- restores
ctx.saves:list()                            -- returns array of slot metadata
ctx.saves:delete(slot)
ctx.saves:on_autosave(function() ... end)  -- called before each autosave
```

## Localization

### CSV format

```csv
key,en,pt_BR,es
ui.menu.start,"Start Game","Iniciar Jogo","Iniciar Juego"
ui.hud.health,"Health: {0}","Vida: {0}","Salud: {0}"
```

### Lua API

```lua
ctx.locale:set("pt_BR")
ctx.locale:t("ui.menu.start")         -- "Iniciar Jogo"
ctx.locale:t("ui.hud.health", 75)     -- "Vida: 75"
```

## NavMesh

### Baking pipeline

```
Geometry collection → Recast rcContext → rcHeightfield → rcCompactHeightfield
    → rcContourSet → rcPolyMesh → dtNavMesh
    → saved as .uznavmesh (binary Detour format)
```

### Runtime pathfinding

```lua
ctx.navmesh:find_path(from_pos, to_pos)  -- returns path array or nil
ctx.navmesh:move_agent(entity, target)   -- drives CNavMeshAgent
```

`CNavMeshAgent` updates entity `CTransform` via `character_controller_move()` each frame. RVO2 avoidance runs for agents within 5m of each other.

## World Streaming

### Streaming volumes

```ini
[streaming_volume name="Town_A"]
bounds_min = -100, 0, -100
bounds_max = 100, 50, 100
chunk = "res://worlds/town_a.uzscene"
load_distance = 150
unload_distance = 200
```

When the camera enters `load_distance`, the chunk is async-loaded from disk. Memory budget defaults to 512MB (configurable in `project.uzproj`).

## Plugin System (Phase 4)

```c
// .uzplugin C ABI — stable, append-only
typedef struct UzPluginApi {
    uint32_t api_version;     // UZ_PLUGIN_API_VERSION
    void   (*on_load)(GameContext*);
    void   (*on_unload)(void);
    void   (*on_update)(GameContext*, float dt);
    uint8_t _reserved[128];   // always zeroed, checked on load
} UzPluginApi;
```

Same ABI stability rules as `game_api_t`: never reorder, append-only, zeroed reserved.

## Workflow

1. **Read the relevant spec** from `docs/specs/` before implementing
2. **Design the Lua API first** — game devs use this; it must be ergonomic
3. **Edit files sequentially** — one file at a time
4. **Write tests** — input mapping, save round-trip, BT tick order, navmesh path validity
5. **Update docs** if the Lua API changes

## ⚠️ MANDATORY: UE5 COMPLETE Component Parity

When implementing ANY gameplay component that has a UE5 equivalent (input, camera, abilities, save, etc.):
1. Read the UE5 `.h` at `W:\UE_5.6_Source` — list EVERY `UPROPERTY`
2. Read the constructor — note EVERY default value
3. Implement ALL properties with EXACT same defaults
4. Implement ALL behavior — same computation, same update logic
5. Cite: `/// @source UE5 <file>:<line>` for every property

**FORBIDDEN:** Simplifying by removing params, inventing defaults, replacing computation with hardcoded values.

## Quality Checklist

Before presenting code:
- [ ] **ALL UE5 properties present** in equivalent components (not a subset)
- [ ] **ALL defaults match UE5** (read constructor, not guessed)
- [ ] Lua API follows `ctx.*` namespace pattern
- [ ] Save files versioned, backward-compatible (version field + migration path)
- [ ] Input bindings persist across sessions (save slot 0)
- [ ] BT tick does not allocate from heap (uses frame arena for scratch)
- [ ] NavMesh agents respect 256 limit (assert in debug)
- [ ] SpringArm collision uses physics query, not raw DX12/Vulkan
- [ ] Locale fallback chain: requested locale → `en` → key string

